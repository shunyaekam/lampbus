[package]
name = "lampd-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "ws", "query"] }
btleplug = "0.13.5"
futures = "0.3.34"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "time", "sync", "signal", "net"] }
uuid = "1.28.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
