name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: BlueZ build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Conformance vectors are up to date
        run: cargo run -q -p lampbus-oracles -- --check
      - name: Without the aes feature
        run: cargo test -p lampbus-defs --no-default-features --lib
      - name: Builds without the optional adapters
        run: cargo build -p lampbus --no-default-features
      - name: Release build
        run: cargo build --release -p lampbus
      - name: The pure crates build for WebAssembly
        run: cargo build --target wasm32-unknown-unknown -p lampbus-defs -p lampbus-render -p lampbus-core

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
