[package]
name = "lampbus-shell"
version = "0.0.1"
description = "Desktop shell for lampbus-core: carries out its actions with btleplug and tokio"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lampbus-core = { path = "../lampbus-core" }
lampbus-defs = { path = "../lampbus-defs" }
btleplug = "0.13"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }
uuid = "1"

[lints]
workspace = true
