[package]
name = "lampbus-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
lampbus-defs = { path = "../crates/lampbus-defs" }
lampbus-render = { path = "../crates/lampbus-render" }
lampbus-core = { path = "../crates/lampbus-core" }

[workspace]

[[bin]]
name = "definition_json"
path = "fuzz_targets/definition_json.rs"
test = false
doc = false

[[bin]]
name = "animation_json"
path = "fuzz_targets/animation_json.rs"
test = false
doc = false

[[bin]]
name = "color_parse"
path = "fuzz_targets/color_parse.rs"
test = false
doc = false

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false

[[bin]]
name = "core_sequences"
path = "fuzz_targets/core_sequences.rs"
test = false
doc = false
