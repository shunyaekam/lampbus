# cargo-deny policy: what may enter the dependency tree. Run: cargo deny check
[graph]
all-features = true

[advisories]
# known vulnerabilities and unmaintained crates fail the check unless explicitly acknowledged below
# paste is a compile-time-only macro crate that rs-matter pulls in (via pinned-init). The advisory is "no longer
# maintained", not a vulnerability, and nothing from it runs in the shipped binary. Revisit when rs-matter moves off it.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build-time only, via rs-matter" }]

[licenses]
# permissive licences only: nothing that would force the project (or someone using it) to change its own licence
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "0BSD", "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# our own crates depend on each other by path inside the workspace, which cargo-deny otherwise reports as wildcards
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# rs-matter is pinned to an exact commit (its release predates the colour-light support)
allow-git = ["https://github.com/project-chip/rs-matter"]
