[workspace]
resolver = "2"
members = ["crates/*", "tools/oracles"]
# the prototypes are standalone and not part of the core workspace
exclude = ["prototypes"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shunyaekam/lampbus"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

# size-first release profile: the scorecard measures this
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
